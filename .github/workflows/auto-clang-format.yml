name: clang-format
on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: '.'
        exclude: './out ./third_party ./external ./generated'
        extensions: 'c,cc,cpp,cxx,h,hpp,hxx'
        clangFormatVersion: 22
        inplace: False
