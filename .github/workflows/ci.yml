name: ci
on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * 1'
  push:
    tags:
    branches:
      - main
      - develop

env:
  # Linux/macOS: match Nix/Docker.
  CLANG_TIDY_VERSION: "22.1.8"
  # Windows: setup-cpp asset list has no LLVM 22 yet; compiler and clang-tidy must match.
  LLVM_VERSION_WINDOWS: "21.1.8"
  # windows-latest ships VS 2026; setup-cpp CMake 3.31 needs a newer build for this generator.
  VS_GENERATOR: "Visual Studio 18 2026"
  CMAKE_VERSION_VS: "4.4.2"
  VERBOSE: 1


jobs:
  sample-shaders:
    name: Validate committed sample shaders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
      - name: Compare compiled shaders with committed SPIR-V
        run: nix shell .#sample-shader-compiler --command bash examples/vulkan_samples/validate_shaders.sh

  compiler-floor:
    if: github.event_name != 'schedule'
    name: compiler floor ${{ matrix.compiler }} ${{ matrix.build_type }} exceptions ${{ matrix.exceptions || 'ON' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc-12, build_type: Debug }
          - { os: ubuntu-24.04, compiler: gcc-12, build_type: Release }
          - { os: ubuntu-24.04, compiler: clang-16, build_type: Debug }
          - { os: ubuntu-24.04, compiler: clang-16, build_type: Release }
          - { os: ubuntu-24.04, compiler: clang-16, build_type: Debug, exceptions: OFF }
          - { os: windows-2022, compiler: msvc-14.43, build_type: Debug }
          - { os: windows-2022, compiler: msvc-14.43, build_type: Debug, exceptions: OFF }
          - { os: windows-2022, compiler: msvc-14.43, build_type: Release }

    steps:
      - uses: actions/checkout@v7

      - name: Setup CMake and Ninja
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true
          vcpkg: false
          ccache: false
          clangtidy: false
          cppcheck: false

      - name: Install Linux compiler and Vulkan runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc-12 g++-12 clang-16 libc++-16-dev libc++abi-16-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libffi-dev mesa-vulkan-drivers
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"

      - name: Select Linux compiler and verify version
        if: runner.os == 'Linux'
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          if [[ "$COMPILER" == gcc-12 ]]; then
            echo 'CC=/usr/bin/gcc-12' >> "$GITHUB_ENV"
            echo 'CXX=/usr/bin/g++-12' >> "$GITHUB_ENV"
            /usr/bin/g++-12 --version
            test "$(/usr/bin/g++-12 -dumpversion | cut -d. -f1)" = 12
          else
            echo 'CC=/usr/bin/clang-16' >> "$GITHUB_ENV"
            echo 'CXX=/usr/bin/clang++-16' >> "$GITHUB_ENV"
            echo 'CXXFLAGS=-stdlib=libc++' >> "$GITHUB_ENV"
            /usr/bin/clang++-16 --version
            test "$(/usr/bin/clang++-16 -dumpversion | cut -d. -f1)" = 16
          fi

      - name: Setup Linux Vulkan SDK
        if: runner.os == 'Linux'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install MSVC 14.43 toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -version '[17.0,18.0)' -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio 2022 was not found' }
          $toolset = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -Filter '14.43.*' -ErrorAction SilentlyContinue
          if (-not $toolset) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $args = @('modify', '--installPath', "`"$vsPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.43.17.13.x86.x64', '--quiet', '--norestart')
            $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Visual Studio installer failed: $($process.ExitCode)" }
          }
          if (-not (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -Filter '14.43.*')) {
            throw 'MSVC 14.43 was not installed'
          }

      - name: Activate MSVC 14.43
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.43'

      - name: Verify MSVC compiler version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $banner = (& cl 2>&1 | Out-String)
          Write-Host $banner
          if ($banner -notmatch 'Version 19\.43\.') { throw 'Expected MSVC compiler 19.43' }

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.350.0
          cache: true

      - name: Install SwiftShader
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.350.0
          install_swiftshader: true
          swiftshader_destination: C:\SwiftShader
          install_runtime: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select SwiftShader Vulkan ICD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $icd = 'C:\SwiftShader\vk_swiftshader_icd.json'
          if (-not (Test-Path $icd)) { throw "SwiftShader ICD was not found: $icd" }
          "VK_DRIVER_FILES=$icd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          EXCEPTIONS: ${{ matrix.exceptions || 'ON' }}
        run: |
          cmake -S . -B build-floor -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_TESTING=ON -Dvkexec_PACKAGING_MAINTAINER_MODE=OFF \
            -Dvkexec_BUILD_VMA=ON -Dvkexec_BUILD_EXAMPLES=ON -Dvkexec_BUILD_TOOLS=ON \
            -Dvkexec_ENABLE_IPO=OFF -Dvkexec_ENABLE_COVERAGE=OFF \
            -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF \
            -Dvkexec_ENABLE_SANITIZER_ADDRESS=OFF -Dvkexec_ENABLE_SANITIZER_UNDEFINED=OFF \
            -DVKEXEC_ENABLE_EXCEPTIONS="$EXCEPTIONS"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-floor -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF `
            -DBUILD_TESTING=ON -Dvkexec_PACKAGING_MAINTAINER_MODE=OFF `
            -Dvkexec_BUILD_VMA=ON -Dvkexec_BUILD_EXAMPLES=ON -Dvkexec_BUILD_TOOLS=ON `
            -Dvkexec_ENABLE_IPO=OFF -Dvkexec_ENABLE_COVERAGE=OFF `
            -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF `
            -Dvkexec_ENABLE_SANITIZER_ADDRESS=OFF -Dvkexec_ENABLE_SANITIZER_UNDEFINED=OFF `
            -DVKEXEC_ENABLE_EXCEPTIONS=${{ matrix.exceptions || 'ON' }}

      - name: Build
        run: cmake --build build-floor

      - name: Test
        working-directory: build-floor
        run: ctest --output-on-failure

  vulkan-validation:
    if: github.event_name != 'schedule'
    name: Vulkan validation (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup CMake and Ninja
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true
          vcpkg: false
          ccache: false
          clangtidy: false
          cppcheck: false

      - name: Install Vulkan driver and validation layer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libffi-dev mesa-vulkan-drivers vulkan-validationlayers
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: |
          cmake -S . -B build-validation -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -Dvkexec_PACKAGING_MAINTAINER_MODE=OFF \
            -Dvkexec_BUILD_VMA=ON -Dvkexec_BUILD_TOOLS=ON -Dvkexec_TEST_VALIDATION=ON \
            -Dvkexec_ENABLE_IPO=OFF -Dvkexec_ENABLE_CLANG_TIDY=OFF \
            -Dvkexec_ENABLE_CPPCHECK=OFF

      - name: Build tests
        run: cmake --build build-validation --target vkexec_tests

      - name: Run unit tests with validation
        run: |
          set -o pipefail
          ctest --test-dir build-validation -R '^unittests\..*' -V 2>&1 | tee validation-ctest.log
          if grep -Eq 'Validation Error|VUID-' validation-ctest.log; then
            echo "Vulkan validation reported an error" >&2
            exit 1
          fi

  thread-sanitizer:
    if: github.event_name != 'schedule'
    name: ThreadSanitizer concurrency (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup CMake and Ninja
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true
          vcpkg: false
          ccache: false
          clangtidy: false
          cppcheck: false

      - name: Install Clang and Vulkan runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-16 mesa-vulkan-drivers
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "CC=/usr/bin/clang-16" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-16" >> "$GITHUB_ENV"

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -Dvkexec_BUILD_EXAMPLES=OFF -Dvkexec_BUILD_TOOLS=OFF -Dvkexec_BUILD_VMA=OFF \
            -Dvkexec_ENABLE_IPO=OFF -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF \
            -Dvkexec_ENABLE_SANITIZER_ADDRESS=OFF -Dvkexec_ENABLE_SANITIZER_LEAK=OFF \
            -Dvkexec_ENABLE_SANITIZER_UNDEFINED=OFF -Dvkexec_ENABLE_SANITIZER_MEMORY=OFF \
            -Dvkexec_ENABLE_SANITIZER_THREAD=ON

      - name: Build concurrency tests
        run: cmake --build build-tsan --target vkexec_concurrency_tests

      - name: Run concurrency tests
        env:
          TSAN_OPTIONS: halt_on_error=1
          VKEXEC_CONCURRENCY_ITERATIONS: 64
        run: ctest --test-dir build-tsan -R '^unittests\.concurrency\.' --output-on-failure

  Test:
    if: github.event_name != 'schedule'
    name: ${{matrix.os}} ${{matrix.compiler}} ${{matrix.build_type}} ${{matrix.packaging_maintainer_mode == 'ON' && '(maintainer mode)' || ''}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      # Recommendations:
      #   * support at least 2 operating systems
      #   * support at least 2 compilers
      #   * make sure all supported configurations for your project are built
      #
      # Disable/enable builds in this list to meet the above recommendations
      # and your own projects needs
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        compiler:
          # you can specify the version after `-` like "llvm-15.0.2".
          - llvm-22.1.8
          - gcc-16
        generator:
          - "Ninja Multi-Config"
        build_type:
          - Release
          - Debug
        packaging_maintainer_mode:
          - ON
          - OFF
        build_shared:
          - OFF

        exclude:
          # mingw is determined by this author to be too buggy to support
          - os: windows-latest
            compiler: gcc-16
          # setup-cpp has no LLVM 22 Windows packages; use 21.1.8 there instead (see include)
          - os: windows-latest
            compiler: llvm-22.1.8
          # Homebrew GCC cannot parse Apple SDK headers that use ObjC blocks
          # (e.g. MDItem.h / CGPath.h) pulled in by GLFW Cocoa.
          - os: macos-latest
            compiler: gcc-16

        include:
          # Add appropriate variables for gcov version required. This will intentionally break
          # if you try to use a compiler that does not have gcov set
          - compiler: gcc-16
            gcov_executable: gcov-16
            enable_ipo: On

          - compiler: llvm-22.1.8
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: windows-latest
            compiler: llvm-21.1.8
            generator: "Ninja Multi-Config"
            build_type: Debug
            packaging_maintainer_mode: ON
            build_shared: OFF
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: windows-latest
            compiler: llvm-21.1.8
            generator: "Ninja Multi-Config"
            build_type: Debug
            packaging_maintainer_mode: OFF
            build_shared: OFF
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: windows-latest
            compiler: llvm-21.1.8
            generator: "Ninja Multi-Config"
            build_type: Release
            packaging_maintainer_mode: ON
            build_shared: OFF
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: windows-latest
            compiler: llvm-21.1.8
            generator: "Ninja Multi-Config"
            build_type: Release
            packaging_maintainer_mode: OFF
            build_shared: OFF
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: macos-latest
            enable_ipo: Off

          # Set up preferred package generators, for given build configurations
          - build_type: Release
            packaging_maintainer_mode: On
            package_generator: TBZ2

          # This exists solely to make sure a non-multiconfig build works
          - os: ubuntu-latest
            compiler: gcc-16
            generator: "Unix Makefiles"
            build_type: Debug
            gcov_executable: gcov-16
            packaging_maintainer_mode: On
            enable_ipo: Off

          # Windows msvc builds
          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 18 2026"
            build_type: Debug
            packaging_maintainer_mode: On
            build_shared: OFF
            enable_ipo: On

          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 18 2026"
            build_type: Release
            packaging_maintainer_mode: On
            build_shared: OFF
            enable_ipo: On

          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 18 2026"
            build_type: Debug
            packaging_maintainer_mode: Off
            build_shared: OFF
            enable_ipo: Off

          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 18 2026"
            build_type: Release
            packaging_maintainer_mode: Off
            build_shared: OFF
            enable_ipo: On
            package_generator: ZIP

          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 18 2026"
            build_type: Release
            packaging_maintainer_mode: On
            build_shared: On
            enable_ipo: On


    steps:
      - name: Check for llvm version mismatches
        if: ${{ runner.os == 'Linux' && contains(matrix.compiler, 'llvm') && !contains(matrix.compiler, env.CLANG_TIDY_VERSION) }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('There is a mismatch between configured llvm compiler and clang-tidy version chosen')

      - uses: actions/checkout@v7

      - name: Setup Cache
        uses: ./.github/actions/setup_cache
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          packaging_maintainer_mode: ${{ matrix.packaging_maintainer_mode }}
          generator: ${{ matrix.generator }}

      - name: Project Name
        uses: cardinalby/export-env-action@v2
        with:
          envFile: '.github/constants.env'


      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ contains(matrix.os, 'windows' )}}

          cmake: ${{ runner.os != 'Windows' || !contains(matrix.generator, 'Visual Studio') && true || env.CMAKE_VERSION_VS }}
          ninja: true
          vcpkg: false
          ccache: true
          clangtidy: ${{ matrix.packaging_maintainer_mode == 'ON' && (runner.os == 'Windows' && env.LLVM_VERSION_WINDOWS || env.CLANG_TIDY_VERSION) || false }}


          cppcheck: true

          gcovr: true
          opencppcoverage: true

      - name: Setup Vulkan SDK
        if: runner.os != 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          # MoltenVK is not a component of this action; install it via Homebrew on macOS.
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # Building Vulkan-Loader from source needs ml64.exe; VS 2026 runners don't
      # expose MASM to setup-vulkan-sdk's vsdevenv shell. Use the prebuilt SDK.
      # Pin past v1.2: recent windows vulkan_sdk.exe layouts break 7z extraction
      # (FindVulkan then misses Lib/); that fix is not in a tagged release yet.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.350.0
          cache: true

      - name: Install SwiftShader
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.350.0
          install_swiftshader: true
          swiftshader_destination: C:\SwiftShader
          install_runtime: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select SwiftShader Vulkan ICD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $swiftShaderIcd = 'C:\SwiftShader\vk_swiftshader_icd.json'
          if (-not (Test-Path $swiftShaderIcd)) {
            Write-Error "SwiftShader ICD was not found: $swiftShaderIcd"
            exit 1
          }

          Write-Host "Using SwiftShader ICD: $swiftShaderIcd"
          "VK_DRIVER_FILES=$swiftShaderIcd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux window-system and lavapipe
        if: runner.os == 'Linux'
        run: |
          # setup-cpp may add apt.llvm.org; a full `apt-get update` fails when that
          # toolchain snapshot is missing ("no longer has a Release file"). These
          # packages live in Ubuntu archives only.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*llvm*' -o -iname '*toolchain*' \) \
            -exec mv {} {}.disabled \;
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libffi-dev \
            mesa-vulkan-drivers
          # Prefer Mesa lavapipe so GPU tests run without a physical GPU.
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          if [[ -z "${ICD}" ]]; then
            echo "lavapipe ICD not found after installing mesa-vulkan-drivers" >&2
            ls -la /usr/share/vulkan/icd.d || true
            exit 1
          fi
          echo "Using Vulkan ICD: ${ICD}"
          echo "VK_DRIVER_FILES=${ICD}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${ICD}" >> "$GITHUB_ENV"

      - name: Install macOS MoltenVK
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk
          MVK_PREFIX="$(brew --prefix molten-vk)"
          HOMEBREW_PREFIX="$(brew --prefix)"
          # Homebrew installs the ICD under etc/vulkan/icd.d (keg and/or prefix).
          for candidate in \
            "${MVK_PREFIX}/etc/vulkan/icd.d/MoltenVK_icd.json" \
            "${HOMEBREW_PREFIX}/etc/vulkan/icd.d/MoltenVK_icd.json"
          do
            if [[ -f "${candidate}" ]]; then
              ICD="${candidate}"
              break
            fi
          done
          if [[ -z "${ICD:-}" ]]; then
            ICD="$(find "${MVK_PREFIX}" "${HOMEBREW_PREFIX}/etc" "${HOMEBREW_PREFIX}/share" \
              -name 'MoltenVK_icd.json' 2>/dev/null | head -1 || true)"
          fi
          if [[ -z "${ICD:-}" || ! -f "${ICD}" ]]; then
            echo "MoltenVK ICD not found after brew install molten-vk" >&2
            echo "MVK_PREFIX=${MVK_PREFIX}" >&2
            ls -laR "${MVK_PREFIX}/etc" "${HOMEBREW_PREFIX}/etc/vulkan" 2>&1 || true
            exit 1
          fi
          echo "Using Vulkan ICD: ${ICD}"
          echo "VK_DRIVER_FILES=${ICD}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${ICD}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${MVK_PREFIX}/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake --version
          cmake -S . -B ./build -G "${{matrix.generator}}" -D${{ env.PROJECT_NAME }}_ENABLE_IPO=${{matrix.enable_ipo }} -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} -D${{ env.PROJECT_NAME }}_PACKAGING_MAINTAINER_MODE:BOOL=${{matrix.packaging_maintainer_mode}} -D${{ env.PROJECT_NAME }}_ENABLE_COVERAGE:BOOL=${{ matrix.build_type == 'Debug' }} -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build (Ninja)
        if: startsWith(matrix.generator, 'Ninja')
        run: |
          cmake --build ./build --config ${{matrix.build_type}} -- -k 0

      - name: Build
        if: ${{ !startsWith(matrix.generator, 'Ninja') }}
        run: |
          cmake --build ./build --config ${{matrix.build_type}}

      - name: Windows Vulkan diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "VK_DRIVER_FILES=$env:VK_DRIVER_FILES"
          Write-Host "VK_ICD_FILENAMES=$env:VK_ICD_FILENAMES"

          $vulkanInfo = Get-Command vulkaninfo -ErrorAction SilentlyContinue
          $vulkanInfoPath = $null

          if ($null -ne $vulkanInfo) {
            $vulkanInfoPath = $vulkanInfo.Source
          } elseif ($env:VULKAN_SDK) {
            $sdkVulkanInfo = Join-Path $env:VULKAN_SDK "Bin/vulkaninfo.exe"
            if (Test-Path $sdkVulkanInfo) {
              $vulkanInfoPath = $sdkVulkanInfo
            }
          }

          if ($null -eq $vulkanInfoPath) {
            Write-Error "vulkaninfo was not found in PATH or VULKAN_SDK/Bin"
            exit 1
          }

          Write-Host "Using vulkaninfo: $vulkanInfoPath"
          & $vulkanInfoPath --summary
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Unix - Test
        if: runner.os != 'Windows'
        working-directory: ./build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: |
          if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "macOS" ]]; then
            echo "VK_DRIVER_FILES=${VK_DRIVER_FILES:-}"
            echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-}"
          fi
          ctest -C ${{matrix.build_type}} --output-on-failure -V --output-junit junit.xml

      - name: Dump Unix CTest log
        if: always() && runner.os != 'Windows'
        working-directory: ./build
        run: |
          if [[ -f Testing/Temporary/LastTest.log ]]; then
            cat Testing/Temporary/LastTest.log
          fi

      - name: Unix - Coverage
        if: runner.os != 'Windows' && matrix.build_type == 'Debug'
        working-directory: ./build
        run: |
          gcovr -j ${{env.nproc}} --config ../gcovr.cfg --root ../ --xml-pretty --xml coverage.xml . --gcov-executable '${{ matrix.gcov_executable }}'

      - name: Windows - Test
        if: runner.os == 'Windows'
        working-directory: ./build
        run: ctest -C ${{matrix.build_type}} --output-on-failure -V --output-junit junit.xml

      - name: Dump Windows CTest log
        if: always() && runner.os == 'Windows'
        working-directory: ./build
        shell: pwsh
        run: |
          if (Test-Path Testing/Temporary/LastTest.log) {
            Get-Content Testing/Temporary/LastTest.log
          }

      - name: Windows - Coverage baseline
        if: runner.os == 'Windows' && matrix.build_type == 'Debug' && matrix.compiler == 'msvc' && matrix.packaging_maintainer_mode == 'Off'
        working-directory: ./build
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\build\test\${{matrix.build_type}}\vkexec_tools_vma_tests.exe" `
            "graphics_pipeline tag factory owns null-layout DR pipeline" `
            -s `
            --allow-running-no-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows - Coverage
        if: runner.os == 'Windows' && matrix.build_type == 'Debug' && matrix.compiler == 'msvc' && matrix.packaging_maintainer_mode == 'Off'
        working-directory: ./build
        shell: pwsh
        run: |
          OpenCppCoverage.exe `
            --modules vkexec_tools_vma_tests.exe `
            --sources "$env:GITHUB_WORKSPACE\include" `
            --sources "$env:GITHUB_WORKSPACE\src" `
            --working_dir "$env:GITHUB_WORKSPACE\build\test" `
            --export_type cobertura:coverage.xml `
            -- "$env:GITHUB_WORKSPACE\build\test\${{matrix.build_type}}\vkexec_tools_vma_tests.exe" `
              "graphics_pipeline tag factory owns null-layout DR pipeline" `
              -s `
              --allow-running-no-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: CPack
        if: matrix.package_generator != ''
        working-directory: ./build
        run: |
          cpack -C ${{matrix.build_type}} -G ${{matrix.package_generator}}

      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.package_generator != '' }}
        with:
          files: |
            build/*-*${{ matrix.build_type }}*-*.*


      - name: Publish to codecov
        if: matrix.build_type == 'Debug' && (runner.os != 'Windows' || (matrix.compiler == 'msvc' && matrix.packaging_maintainer_mode == 'Off'))
        uses: codecov/codecov-action@v7
        with:
          # Upload when CODECOV_TOKEN is configured; do not fail forks without a token.
          fail_ci_if_error: false
          disable_search: true
          flags: ${{ runner.os }}
          name: ${{ runner.os }}-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.xml

      - name: Publish test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          disable_search: true
          files: ./build/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

  package-consumer:
    name: Installed package / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-full-static, os: ubuntu-latest, compiler: gcc-12, shared: 'OFF', vma: 'ON', tools: 'ON' }
          - { name: linux-minimal-static, os: ubuntu-latest, compiler: gcc-12, shared: 'OFF', vma: 'OFF', tools: 'OFF' }
          - { name: linux-full-shared, os: ubuntu-latest, compiler: gcc-12, shared: 'ON', vma: 'ON', tools: 'ON' }
          - { name: windows-full-static, os: windows-2022, compiler: msvc-14.43, shared: 'OFF', vma: 'ON', tools: 'ON' }
          - { name: windows-full-shared, os: windows-2022, compiler: msvc-14.43, shared: 'ON', vma: 'ON', tools: 'ON' }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ runner.os == 'Windows' }}
          cmake: true
          ninja: true
          ccache: true
          clangtidy: false
          cppcheck: false

      - name: Setup Vulkan SDK
        if: runner.os != 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@033219e2d69dd4d3e873e217eb385fdd4b4438f4
        with:
          version: 1.4.350.0
          cache: true

      - name: Configure package
        run: cmake -S . -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -Dvkexec_ENABLE_INSTALL_CONSUMER_TEST=ON -Dvkexec_ENABLE_IPO=OFF -Dvkexec_BUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=${{ matrix.shared }} -Dvkexec_BUILD_VMA=${{ matrix.vma }} -Dvkexec_BUILD_TOOLS=${{ matrix.tools }} -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF

      - name: Build package tree
        run: cmake --build build-package --config Release --parallel

      - name: Consume relocated package
        run: cmake --build build-package --config Release --target vkexec_install_consumer

  vma-off:
    name: VMA-OFF core and resource allocator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-22.1.8
          cmake: true
          ninja: true
          ccache: true
          clangtidy: false
          cppcheck: false

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure without VMA
        run: |
          cmake -S . -B ./build-vma-off -G Ninja -DCMAKE_BUILD_TYPE:STRING=Debug -DBUILD_TESTING=ON -Dvkexec_BUILD_VMA=OFF -Dvkexec_BUILD_EXAMPLES=OFF -Dvkexec_BUILD_TOOLS=OFF -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF

      - name: Build core, graphics, extensions, and tests
        run: cmake --build ./build-vma-off --target vkexec_core_tests vkexec_core_header_checks vkexec_features_header_checks vkexec_graphics_header_checks vkexec_descriptor_heap_header_checks vkexec_dynamic_rendering_header_checks vkexec_timeline_header_checks

      - name: Test non-VMA allocator and module boundary
        working-directory: ./build-vma-off
        run: ctest -R 'generic resources use a non-VMA allocator|vkexec\.vma_module_boundary' --output-on-failure

  stdexec-main-compat:
    if: github.event_name == 'schedule'
    name: stdexec main compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-22.1.8
          cmake: true
          ninja: true
          ccache: true
          clangtidy: false
          cppcheck: false

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B ./build -G Ninja -DCMAKE_BUILD_TYPE:STRING=Debug -DBUILD_TESTING=ON -Dvkexec_BUILD_EXAMPLES=OFF -Dvkexec_BUILD_TOOLS=OFF -Dvkexec_ENABLE_CLANG_TIDY=OFF -Dvkexec_ENABLE_CPPCHECK=OFF -DVKEXEC_STDEXEC_GIT_TAG:STRING=main

      - name: Build representative tests
        run: cmake --build ./build --target vkexec_tests

      - name: Check private stdexec API boundary
        working-directory: ./build
        run: ctest -R '^vkexec\.stdexec_public_api_boundary$' --output-on-failure
