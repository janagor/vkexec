root = .
search-path = out

filter = ^include/
filter = ^src/

include = ^include/.*\.(h|hh|hpp|hxx|inl)$
include = ^src/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl)$

exclude-unreachable-branches = yes
exclude-throw-branches = yes
exclude-noncode-lines = yes
merge-lines = yes

gcov-ignore-parse-errors = all
print-summary = yes
